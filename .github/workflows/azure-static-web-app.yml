name: Deploy us.prezlo.io to Azure Static Web Apps

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: prezlo-us-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build
      - name: Add the hosting config to the build output
        run: cp staticwebapp.config.json dist/staticwebapp.config.json
      - name: Upload to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: dist
          skip_app_build: true
          api_location: ""
